[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2-fixtures-pci-dss-compliance"
version = "1.0.0"
description = "Python metric fixtures for L2 Testing Type: PCI-DSS Compliance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["l2_fixtures"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
